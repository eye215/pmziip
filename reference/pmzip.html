<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PM.zip</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#202735;font:14px system-ui,sans-serif}header{background:white;border-bottom:1px solid #ddd;padding:18px 5%;display:flex;justify-content:space-between}main{max-width:1000px;margin:auto;padding:24px 16px}h1{font-size:26px;margin:0}h2{font-size:19px}small,p{color:#687385;line-height:1.6}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{border:0;border-radius:9px;padding:11px 14px;background:#e9edf3;color:#263447;cursor:pointer;font-weight:600}button.active,button.primary{background:#285bd4;color:white}section{background:white;border:1px solid #e0e4ea;border-radius:15px;padding:20px;margin-bottom:14px}label{display:block;font-weight:600;margin:12px 0 5px}input,textarea,select{width:100%;padding:11px;border:1px solid #d5dae2;border-radius:8px;font:inherit;background:white}textarea{min-height:85px} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.metric{background:#f6f8fc;padding:16px;border-radius:10px}.metric b{display:block;font-size:24px;margin-top:8px}.line{border-top:1px solid #e5e8ed;padding:14px 0}.muted{color:#687385} .tag{font-size:12px;color:#285bd4} .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}pre{white-space:pre-wrap;font:inherit;line-height:1.8} .danger{color:#a33} </style><header><strong>PM.zip <small> / Product Impact Tracker</small></strong><small>LOCAL MVP</small></header><main><h1>제품 성과 워크스페이스</h1><p>요구사항부터 성과 검증까지 · 브라우저 로컬 저장 · 가상 데이터로 테스트</p><section><div class="grid"><div><label>프로젝트</label><input id="project" value="Galaxy Coach"></div><div><label>조회 월</label><input type="month" id="month" value="2026-11"></div></div><div class="actions"><button onclick="add()" class="primary">+ 요구사항 등록</button><button onclick="exportData()">백업 JSON</button></div></section><nav id="nav"></nav><div id="view"></div></main><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[];try{rows=JSON.parse(localStorage.getItem('pmzip-v1')||'[]')}catch{}let tab='요구사항',selected=null;const tabs=['요구사항','측정 계획','데이터','타임라인','성과 리포트'];const types={'접근성':['대상군 완료율','완료 세션 / 시작 세션','OS, 언어, session_id, status','입력 방식 선택 이벤트'],'재사용':['D7 재사용률','첫 이용 후 7일 이내 재이용 사용자 / 첫 이용 사용자','user_id, session_id, started_at','진입 경로 이벤트'],'AI 품질':['정책 준수율','통과 QA 건수 / 전체 QA 건수','test_id, version, pass','모델 및 정책 버전'],'사용성':['태스크 성공률','성공 건수 / 시도 건수','session_id, event, status','실패 사유 이벤트'],'기타':['목표 달성률','달성 건수 / 대상 건수','id, status, timestamp','필요 로그 직접 정의']};function save(){localStorage.setItem('pmzip-v1',JSON.stringify(rows))}function list(){return rows.filter(r=>r.project===$('project').value)}function cur(){return rows.find(r=>r.id===selected)}function add(){let r={id:Date.now(),project:$('project').value,month:$('month').value,title:'',raw:'',type:'접근성',problem:'',hypothesis:'',kpi:'',formula:'',fields:'',logs:'',release:'',change:'',beforeN:'',beforeD:'',afterN:'',afterD:'',beforePeriod:'',afterPeriod:'',confound:'',contribution:''};rows.push(r);selected=r.id;tab='요구사항';save();render()}function set(k,v){let r=cur();if(r){r[k]=v;save()}}function field(k,l,area=false,type='text'){let v=esc(cur()?.[k]);return `<label>${l}</label>${area?`<textarea onchange="set('${k}',this.value)">${v}</textarea>`:`<input type="${type}" value="${v}" onchange="set('${k}',this.value)">`}`}function choose(id){selected=+id;render()}function suggest(){let r=cur(),a=types[r.type];[r.kpi,r.formula,r.fields,r.logs]=a;r.hypothesis=r.hypothesis||'개선 대상 사용자군에서 '+a[0]+'이 개선될 것이다.';save();render()}function pct(n,d){return n!==''&&d!==''&&+d>0&&+n>=0&&+n<=+d?100*n/d:null}function report(r){let b=pct(r.beforeN,r.beforeD),a=pct(r.afterN,r.afterD);return `${r.title||'제목 없음'}\n문제: ${r.problem||'미정'}\n가설: ${r.hypothesis||'미정'}\n지표: ${r.kpi||'미정'} (${r.formula||'미정'})\n배포: ${r.release||'미확정'}\n변경 내용: ${r.change||'미기록'}\n개선 전: ${b===null?'미확보':b.toFixed(1)+'%'} (${r.beforePeriod||'기간 미정'})\n개선 후: ${a===null?'미확보':a.toFixed(1)+'%'} (${r.afterPeriod||'기간 미정'})\n변화: ${a===null||b===null?'검증 대기':(a-b).toFixed(1)+'%p'}\n외부 요인: ${r.confound||'미검토'}\n개인 기여: ${r.contribution||'미기록'}\n해석: 단순 전후 비교이며 인과관계는 확정할 수 없음.`}function download(name,txt,type){let u=URL.createObjectURL(new Blob([txt],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportData(){download('pmzip-backup.json',JSON.stringify(rows,null,2),'application/json')}function render(){$('nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('');let rr=list(),r=cur();if(!r||!rr.includes(r)){selected=rr[0]?.id;r=cur()}let picker=`<section><label>개선 과제 선택</label><select onchange="choose(this.value)">${rr.map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${esc(x.month)} · ${esc(x.title||'새 요구사항')}</option>`).join('')}</select></section>`;let html='';if(tab==='타임라인'){html='<section><h2>전체 배포 이력</h2>'+rr.slice().sort((a,b)=>(a.release||'9999').localeCompare(b.release||'9999')).map(x=>`<div class="line"><span class="tag">${esc(x.release||'배포 미정')}</span> <b>${esc(x.title||'제목 없음')}</b><p>${esc(x.change||'변경 내용 미등록')}</p></div>`).join('')+'</section>'}else if(tab==='성과 리포트'){let m=$('month').value, subset=rr.filter(x=>x.month===m||x.release.startsWith(m)||x.afterPeriod.includes(m));html=`<section><h2>${esc(m)} 월별 리포트</h2><small>요구사항 월·배포 월·성과 관측 기간 기준 포함</small><pre>${esc(subset.map(report).join('\n\n──────────\n\n')||'해당 월 기록 없음')}</pre><button onclick="download('report.txt',list().filter(x=>x.month===$('month').value||x.release.startsWith($('month').value)||x.afterPeriod.includes($('month').value)).map(report).join('\n\n'),'text/plain')">리포트 내보내기</button></section>`}else if(!r){html='<section>아직 요구사항이 없습니다. 상단에서 등록하세요.</section>'}else if(tab==='요구사항'){html=picker+`<section><h2>요구사항 및 개선 이력</h2>${field('title','제목')}${field('month','목표 월',false,'month')}${field('raw','요구사항 원문',true)}<label>개선 유형</label><select onchange="set('type',this.value)">${Object.keys(types).map(x=>`<option ${x===r.type?'selected':''}>${x}</option>`).join('')}</select>${field('problem','문제 정의',true)}${field('change','실제 변경 내용',true)}${field('release','실제 배포일',false,'date')}${field('contribution','개인 기여도',true)}<div class="actions"><button class="primary" onclick="tab='측정 계획';render()">측정 계획으로</button></div></section>`}else if(tab==='측정 계획'){html=picker+`<section><h2>성과 측정 계획</h2><p>유형별 규칙 기반 추천입니다. AI API는 아직 연결되지 않았습니다.</p><button class="primary" onclick="suggest()">지표 초안 추천</button>${field('hypothesis','가설',true)}${field('kpi','핵심 지표')}${field('formula','산식')}${field('fields','필요 데이터',true)}${field('logs','신규 로그 요청',true)}${field('confound','캠페인 등 외부 변수',true)}</section>`}else{let b=pct(r.beforeN,r.beforeD),a=pct(r.afterN,r.afterD);html=picker+`<section><h2>개선 전후 데이터</h2><p>비율 지표의 분자·분모를 직접 입력하세요. 동일한 사용자군 및 관측 기간을 사용해야 합니다.</p><div class="grid"><div>${field('beforePeriod','개선 전 기간 (YYYY-MM 포함)')}${field('beforeN','개선 전 분자',false,'number')}${field('beforeD','개선 전 분모',false,'number')}</div><div>${field('afterPeriod','개선 후 기간 (YYYY-MM 포함)')}${field('afterN','개선 후 분자',false,'number')}${field('afterD','개선 후 분모',false,'number')}</div></div><button onclick="render()">계산 결과 갱신</button><div class="grid" style="margin-top:15px"><div class="metric">개선 전<b>${b===null?'—':b.toFixed(1)+'%'}</b></div><div class="metric">개선 후<b>${a===null?'—':a.toFixed(1)+'%'}</b></div><div class="metric">변화<b>${a===null||b===null?'—':(a-b).toFixed(1)+'%p'}</b></div></div></section>`}$('view').innerHTML=html} $('project').onchange=render;$('month').onchange=render;render();</script></html>
